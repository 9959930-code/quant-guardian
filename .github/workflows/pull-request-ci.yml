name: Pull Request CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python modules
        run: >
          python -m py_compile
          quant_guardian.py btc_guardian.py btc_research.py
          btc_v07_advisory.py btc_v07_split_advisory.py btc_v07_telegram.py
          build_dashboard.py launch_dashboard.py telegram_notify.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
