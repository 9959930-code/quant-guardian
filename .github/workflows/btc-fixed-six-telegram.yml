name: BTC Fixed Six-Trade Telegram

on:
  schedule:
    # 15-minute polling at non-round minutes. 00:17 UTC equals 09:17 KST.
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:
    inputs:
      force_status:
        description: "Send a status report on this run"
        required: false
        default: false
        type: boolean
      reset_state:
        description: "Reset to KRW 10,000,000 and 0 BTC"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - "btc_fixed_advisory.py"
      - "btc_fixed_telegram_bot.py"
      - "tests/test_btc_fixed_advisory.py"
      - "tests/test_btc_fixed_telegram_bot.py"
      - "docs/btc/fixed-six/**"
      - ".github/workflows/btc-fixed-six-telegram.yml"
  pull_request:
    paths:
      - "btc_fixed_advisory.py"
      - "btc_fixed_telegram_bot.py"
      - "tests/test_btc_fixed_advisory.py"
      - "tests/test_btc_fixed_telegram_bot.py"
      - "docs/btc/fixed-six/**"
      - ".github/workflows/btc-fixed-six-telegram.yml"
      - ".github/workflows/pull-request-ci.yml"

permissions:
  contents: read

concurrency:
  group: btc-fixed-six-state
  cancel-in-progress: false

jobs:
  service:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install full test dependencies
        if: github.event_name != 'schedule'
        run: python -m pip install -r requirements.txt

      - name: Compile fixed-six modules
        run: python -m py_compile btc_fixed_advisory.py btc_fixed_telegram_bot.py

      - name: Run complete unit and regression tests
        if: github.event_name != 'schedule'
        run: python -m unittest discover -s tests -v

      - name: Restore persistent BTC state
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: data/state/btc_fixed_state.json
          key: btc-fixed-six-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            btc-fixed-six-state-

      - name: Run fixed-six Telegram service
        if: github.event_name != 'pull_request'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MANUAL_FORCE_STATUS: ${{ inputs.force_status }}
          MANUAL_RESET_STATE: ${{ inputs.reset_state }}
        run: |
          mkdir -p data/state
          EXTRA_ARGS=""
          if [ "$MANUAL_FORCE_STATUS" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --force-status"
          fi
          if [ "$MANUAL_RESET_STATE" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --reset-state"
          fi
          python btc_fixed_telegram_bot.py \
            --state-file data/state/btc_fixed_state.json \
            $EXTRA_ARGS

      - name: Validate persistent state safety
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/state/btc_fixed_state.json")
          state = json.loads(path.read_text(encoding="utf-8"))
          assert state["schema_version"] == 4
          assert state["strategy_version"] == "btc-fixed-six-upbit-telegram-1.0"
          assert state["account"]["cash_krw"] >= 0
          assert state["account"]["btc_quantity"] >= 0
          assert state["account"]["reserve_next_krw"] >= 0
          assert state["account"]["reserve_next_krw"] <= state["account"]["cash_krw"] + 1
          assert state["strategy"]["phase"] in {"WAITING_ENTRY", "ENTRY", "HOLD", "EXIT"}
          print(
              json.dumps(
                  {
                      "strategy_version": state["strategy_version"],
                      "phase": state["strategy"]["phase"],
                      "total_contributions_krw": state["account"]["total_contributions_krw"],
                      "btc_quantity": state["account"]["btc_quantity"],
                      "pending_sync": bool(state["telegram"].get("pending_sync")),
                      "pending_operation": bool(state["telegram"].get("pending_operation")),
                  },
                  ensure_ascii=False,
                  indent=2,
              )
          )
          PY

      - name: Save persistent BTC state
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: data/state/btc_fixed_state.json
          key: btc-fixed-six-state-${{ github.run_id }}-${{ github.run_attempt }}
