name: BTC + ISA Portfolio Telegram

on:
  schedule:
    # 15-minute polling at non-round minutes. 00:17 UTC equals 09:17 KST.
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:
    inputs:
      force_status:
        description: "Send a BTC status report on this run"
        required: false
        default: false
        type: boolean
      force_isa_status:
        description: "Send an ISA status report on this run"
        required: false
        default: false
        type: boolean
      reset_state:
        description: "Reset BTC to KRW 10,000,000 and 0 BTC"
        required: false
        default: false
        type: boolean
      reset_isa_state:
        description: "Reset ISA alert state to approved existing holdings"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - "btc_fixed_advisory.py"
      - "btc_fixed_telegram_bot.py"
      - "btc_clock_hybrid_core.py"
      - "btc_clock_hybrid_telegram.py"
      - "btc_clock_hybrid_runtime.py"
      - "btc_clock_hybrid_portfolio_runner.py"
      - "isa_leverage_advisory.py"
      - "isa_leverage_core.py"
      - "isa_leverage_messages.py"
      - "portfolio_telegram_bot.py"
      - "tests/test_btc_fixed_advisory.py"
      - "tests/test_btc_fixed_telegram_bot.py"
      - "tests/test_zz_btc_clock_hybrid_runtime.py"
      - "tests/test_isa_leverage_advisory.py"
      - "tests/test_portfolio_telegram_bot.py"
      - "docs/btc/fixed-six/**"
      - "docs/isa/**"
      - ".github/workflows/btc-fixed-six-telegram.yml"
  pull_request:
    paths:
      - "btc_fixed_advisory.py"
      - "btc_fixed_telegram_bot.py"
      - "btc_clock_hybrid_core.py"
      - "btc_clock_hybrid_telegram.py"
      - "btc_clock_hybrid_runtime.py"
      - "btc_clock_hybrid_portfolio_runner.py"
      - "isa_leverage_advisory.py"
      - "isa_leverage_core.py"
      - "isa_leverage_messages.py"
      - "portfolio_telegram_bot.py"
      - "tests/test_btc_fixed_advisory.py"
      - "tests/test_btc_fixed_telegram_bot.py"
      - "tests/test_zz_btc_clock_hybrid_runtime.py"
      - "tests/test_isa_leverage_advisory.py"
      - "tests/test_portfolio_telegram_bot.py"
      - "docs/btc/fixed-six/**"
      - "docs/isa/**"
      - ".github/workflows/btc-fixed-six-telegram.yml"
      - ".github/workflows/pull-request-ci.yml"

permissions:
  contents: read
  statuses: write

concurrency:
  group: quant-guardian-telegram-state
  cancel-in-progress: false

jobs:
  service:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python for scheduled service
        if: github.event_name == 'schedule'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Python with pip cache
        if: github.event_name != 'schedule'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install full test dependencies
        if: github.event_name != 'schedule'
        run: python -m pip install -r requirements.txt

      - name: Compile portfolio Telegram modules
        run: >
          python -m py_compile
          btc_fixed_advisory.py btc_fixed_telegram_bot.py
          btc_clock_hybrid_core.py btc_clock_hybrid_telegram.py
          btc_clock_hybrid_runtime.py btc_clock_hybrid_portfolio_runner.py
          isa_leverage_core.py isa_leverage_messages.py isa_leverage_advisory.py
          portfolio_telegram_bot.py tests/test_zz_btc_clock_hybrid_runtime.py

      - name: Run complete unit and regression tests
        if: github.event_name != 'schedule'
        run: python -m unittest discover -s tests -v

      - name: Restore persistent BTC state
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: data/state/btc_fixed_state.json
          key: btc-fixed-six-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            btc-fixed-six-state-

      - name: Restore persistent ISA state
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: data/state/isa_leverage_state.json
          key: isa-tiger-leverage-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            isa-tiger-leverage-state-

      - name: Run unified BTC and ISA Telegram service
        if: github.event_name != 'pull_request'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MANUAL_FORCE_BTC_STATUS: ${{ inputs.force_status }}
          MANUAL_FORCE_ISA_STATUS: ${{ inputs.force_isa_status }}
          MANUAL_RESET_BTC_STATE: ${{ inputs.reset_state }}
          MANUAL_RESET_ISA_STATE: ${{ inputs.reset_isa_state }}
        run: |
          mkdir -p data/state
          ARGS=(
            --btc-state-file data/state/btc_fixed_state.json
            --isa-state-file data/state/isa_leverage_state.json
          )
          if [ "$MANUAL_FORCE_BTC_STATUS" = "true" ]; then
            ARGS+=(--force-btc-status)
          fi
          if [ "$MANUAL_FORCE_ISA_STATUS" = "true" ]; then
            ARGS+=(--force-isa-status)
          fi
          if [ "$MANUAL_RESET_BTC_STATE" = "true" ]; then
            ARGS+=(--reset-btc-state)
          fi
          if [ "$MANUAL_RESET_ISA_STATE" = "true" ]; then
            ARGS+=(--reset-isa-state)
          fi
          python btc_clock_hybrid_portfolio_runner.py "${ARGS[@]}"

      - name: Validate persistent portfolio state safety
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          btc = json.loads(
              Path("data/state/btc_fixed_state.json").read_text(encoding="utf-8")
          )
          assert btc["schema_version"] == 5
          assert btc["strategy_version"] == "btc-fixed-six-clock-hybrid-1.1"
          assert btc["account"]["cash_krw"] >= 0
          assert btc["account"]["btc_quantity"] >= 0
          assert btc["account"]["reserve_next_krw"] >= 0
          assert btc["account"]["reserve_next_krw"] <= btc["account"]["cash_krw"] + 1
          assert btc["strategy"]["phase"] in {"WAITING_ENTRY", "ENTRY", "HOLD", "EXIT"}
          assert btc["telegram"].get("unified_menu_version", 0) >= 2
          assert "btc-fixed-six-v4-to-clock-hybrid-v5" in btc["migrations"]
          for key in (
              "entry_watch_alerted_epochs",
              "entry_alerted_epochs",
              "halving_alerted_epochs",
              "exit_warning_alerted_epochs",
          ):
              assert isinstance(btc["strategy"][key], list)
          pending = btc["telegram"].get("pending_sync")
          if pending:
              assert pending["policy_version"] == "btc-fixed-six-clock-hybrid-1.1"
              assert "age_anchor_at_utc" in pending
              assert isinstance(pending["plan_expired"], bool)

          isa = json.loads(
              Path("data/state/isa_leverage_state.json").read_text(encoding="utf-8")
          )
          assert isa["schema_version"] == 1
          assert isa["strategy_version"] == "isa-tiger-leverage-telegram-1.0"
          assert isa["strategy"]["auto_order"] is False
          assert isa["strategy"]["initial_investment_krw"] == 10_000_000
          assert isa["strategy"]["monthly_contribution_krw"] == 500_000
          assert isa["account"]["tiger_quantity"] >= 0
          assert isa["account"]["tiger_invested_krw"] >= 0
          holdings = {
              item["code"]: item["quantity"]
              for item in isa["account"]["existing_holdings"]
          }
          assert holdings == {"442580": 7.0, "0048J0": 145.0, "379810": 70.0}

          print(
              json.dumps(
                  {
                      "btc_strategy_version": btc["strategy_version"],
                      "btc_schema_version": btc["schema_version"],
                      "btc_phase": btc["strategy"]["phase"],
                      "btc_quantity": btc["account"]["btc_quantity"],
                      "btc_cash_krw": btc["account"]["cash_krw"],
                      "btc_pending": None if not pending else {
                          "kind": pending["kind"],
                          "step": pending["step"],
                          "expired": pending["plan_expired"],
                      },
                      "isa_initial_completed": isa["strategy"]["initial_completed"],
                      "isa_tiger_quantity": isa["account"]["tiger_quantity"],
                      "isa_tiger_invested_krw": isa["account"]["tiger_invested_krw"],
                      "menu_version": btc["telegram"]["unified_menu_version"],
                      "auto_order": False,
                  },
                  ensure_ascii=False,
                  indent=2,
              )
          )
          PY

      - name: Save persistent BTC state
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: data/state/btc_fixed_state.json
          key: btc-fixed-six-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save persistent ISA state
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: data/state/isa_leverage_state.json
          key: isa-tiger-leverage-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish portfolio live health status
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          job_status = os.environ["JOB_STATUS"]
          state = "success" if job_status == "success" else "failure"
          description = (
              "BTC clock-hybrid and ISA state validation passed"
              if state == "success"
              else "BTC/ISA portfolio workflow failed; inspect the linked run"
          )
          repository = os.environ["REPOSITORY"]
          sha = os.environ["COMMIT_SHA"]
          run_id = os.environ["RUN_ID"]
          payload = json.dumps(
              {
                  "state": state,
                  "context": "quant-guardian/portfolio-live",
                  "description": description,
                  "target_url": f"https://github.com/{repository}/actions/runs/{run_id}",
              }
          ).encode("utf-8")
          request = Request(
              f"https://api.github.com/repos/{repository}/statuses/{sha}",
              data=payload,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
                  "User-Agent": "quant-guardian-workflow-health",
              },
              method="POST",
          )
          with urlopen(request, timeout=30) as response:
              result = json.load(response)
          print(
              json.dumps(
                  {
                      "context": result["context"],
                      "state": result["state"],
                      "target_url": result["target_url"],
                  },
                  indent=2,
              )
          )
          PY
