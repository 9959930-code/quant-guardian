# Retired on 2026-11-22 after the user replaced Telegram delivery with ChatGPT Scheduled.
# Historical BTC/ISA runner and cache are deliberately NOT reset or deleted.
# A manual invocation is an audit-only no-op and sends no Telegram messages.
name: Legacy BTC and ISA Telegram (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm Telegram workflow has been retired
        run: |
          echo "Legacy BTC/ISA Telegram service retired 2026-11-22."
          echo "No bot tokens, account files, caches, trades or external dispatch are used."
          echo "Primary BTC alerts: ChatGPT Scheduled, every day 09:17 Asia/Seoul."
          echo "Policy: docs/btc/GPT_PRIMARY_POLICY_2026-11-22.md."
