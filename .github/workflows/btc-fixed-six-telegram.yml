name: BTC + ISA Portfolio Telegram

on:
  schedule:
    # 15-minute polling at non-round minutes. 00:17 UTC equals 09:17 KST.
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:
    inputs:
      service_only:
        description: "Lightweight recovery run (no dependency install or state reset)"
        required: false
        default: false
        type: boolean
      trigger_source:
        description: "Invocation source"
        required: false
        default: manual
        type: choice
        options: [manual, cloudflare_watchdog]
      force_status:
        description: "Send a BTC status report on this run"
        required: false
        default: false
        type: boolean
      force_isa_status:
        description: "Send an ISA status report on this run"
        required: false
        default: false
        type: boolean
      reset_state:
        description: "Reset BTC to KRW 10,000,000 and 0 BTC"
        required: false
        default: false
        type: boolean
      reset_isa_state:
        description: "Reset ISA alert state to approved existing holdings"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - "btc_fixed_advisory.py"
      - "btc_fixed_telegram_bot.py"
      - "btc_clock_hybrid_core.py"
      - "btc_clock_hybrid_telegram.py"
      - "btc_clock_hybrid_runtime.py"
      - "btc_clock_hybrid_portfolio_runner.py"
      - "portfolio_operational_alerts.py"
      - "portfolio_state_guard.py"
      - "portfolio_operational_delivery.py"
      - "tests/test_zzzzzz_portfolio_reliability.py"
      - "isa_leverage_advisory.py"
      - "isa_leverage_core.py"
      - "isa_leverage_messages.py"
      - "portfolio_telegram_bot.py"
      - "tests/test_btc_fixed_advisory.py"
      - "tests/test_btc_fixed_telegram_bot.py"
      - "tests/test_zz_btc_clock_hybrid_runtime.py"
      - "tests/test_zzzz_portfolio_operational_alerts.py"
      - "tests/test_isa_leverage_advisory.py"
      - "tests/test_portfolio_telegram_bot.py"
      - "docs/btc/fixed-six/**"
      - "docs/isa/**"
      - ".github/workflows/btc-fixed-six-telegram.yml"
  pull_request:
    paths:
      - "btc_fixed_advisory.py"
      - "btc_fixed_telegram_bot.py"
      - "btc_clock_hybrid_core.py"
      - "btc_clock_hybrid_telegram.py"
      - "btc_clock_hybrid_runtime.py"
      - "btc_clock_hybrid_portfolio_runner.py"
      - "portfolio_operational_alerts.py"
      - "portfolio_state_guard.py"
      - "portfolio_operational_delivery.py"
      - "tests/test_zzzzzz_portfolio_reliability.py"
      - "isa_leverage_advisory.py"
      - "isa_leverage_core.py"
      - "isa_leverage_messages.py"
      - "portfolio_telegram_bot.py"
      - "tests/test_btc_fixed_advisory.py"
      - "tests/test_btc_fixed_telegram_bot.py"
      - "tests/test_zz_btc_clock_hybrid_runtime.py"
      - "tests/test_zzzz_portfolio_operational_alerts.py"
      - "tests/test_isa_leverage_advisory.py"
      - "tests/test_portfolio_telegram_bot.py"
      - "docs/btc/fixed-six/**"
      - "docs/isa/**"
      - ".github/workflows/btc-fixed-six-telegram.yml"
      - ".github/workflows/pull-request-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('portfolio-pr-{0}', github.event.number) || 'quant-guardian-telegram-state' }}
  cancel-in-progress: false

jobs:
  service:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    env:
      QG_SERVICE_ONLY: ${{ inputs.service_only }}
      QG_TRIGGER_SOURCE: ${{ inputs.trigger_source || github.event_name }}
      MANUAL_RESET_BTC_STATE: ${{ inputs.reset_state }}
      MANUAL_RESET_ISA_STATE: ${{ inputs.reset_isa_state }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python for scheduled service
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.service_only)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Python with pip cache
        if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.service_only)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install full test dependencies
        if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.service_only)
        run: python -m pip install -r requirements.txt

      - name: Compile portfolio Telegram modules
        run: >
          python -m py_compile
          btc_fixed_advisory.py btc_fixed_telegram_bot.py
          btc_clock_hybrid_core.py btc_clock_hybrid_telegram.py
          btc_clock_hybrid_runtime.py btc_clock_hybrid_portfolio_runner.py
          portfolio_operational_alerts.py portfolio_operational_delivery.py portfolio_state_guard.py
          isa_leverage_core.py isa_leverage_messages.py isa_leverage_advisory.py
          portfolio_telegram_bot.py tests/test_zz_btc_clock_hybrid_runtime.py
          tests/test_zzzz_portfolio_operational_alerts.py

      - name: Run complete unit and regression tests
        if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.service_only)
        run: python -m unittest discover -s tests -v

      - name: Restore persistent BTC state
        id: restore_btc
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: data/state/btc_fixed_state.json
          key: btc-fixed-six-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            btc-fixed-six-state-

      - name: Restore persistent ISA state
        id: restore_isa
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: data/state/isa_leverage_state.json
          key: isa-tiger-leverage-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            isa-tiger-leverage-state-

      - name: Refuse missing or mismatched state caches
        id: preflight
        if: github.event_name != 'pull_request'
        env:
          BTC_CACHE_KEY: ${{ steps.restore_btc.outputs.cache-matched-key }}
          ISA_CACHE_KEY: ${{ steps.restore_isa.outputs.cache-matched-key }}
        run: python portfolio_state_guard.py preflight

      - name: Run unified BTC and ISA Telegram service
        id: portfolio
        if: github.event_name != 'pull_request'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MANUAL_FORCE_BTC_STATUS: ${{ inputs.force_status }}
          MANUAL_FORCE_ISA_STATUS: ${{ inputs.force_isa_status }}
          MANUAL_RESET_BTC_STATE: ${{ inputs.reset_state }}
          MANUAL_RESET_ISA_STATE: ${{ inputs.reset_isa_state }}
        run: |
          mkdir -p data/state output
          ARGS=(
            --btc-state-file data/state/btc_fixed_state.json
            --isa-state-file data/state/isa_leverage_state.json
          )
          if [ "$MANUAL_FORCE_BTC_STATUS" = "true" ]; then
            ARGS+=(--force-btc-status)
          fi
          if [ "$MANUAL_FORCE_ISA_STATUS" = "true" ]; then
            ARGS+=(--force-isa-status)
          fi
          if [ "$MANUAL_RESET_BTC_STATE" = "true" ]; then
            ARGS+=(--reset-btc-state)
          fi
          if [ "$MANUAL_RESET_ISA_STATE" = "true" ]; then
            ARGS+=(--reset-isa-state)
          fi
          python btc_clock_hybrid_portfolio_runner.py "${ARGS[@]}" | tee output/portfolio-service-result.json

      - name: Validate persistent portfolio state safety
        id: state_check
        if: always() && github.event_name != 'pull_request' && steps.preflight.outcome == 'success'
        run: python portfolio_state_guard.py finalize

      - name: Save persistent BTC state
        if: always() && github.event_name != 'pull_request' && steps.state_check.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: data/state/btc_fixed_state.json
          key: btc-fixed-six-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save persistent ISA state
        if: always() && github.event_name != 'pull_request' && steps.state_check.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: data/state/isa_leverage_state.json
          key: isa-tiger-leverage-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Check data health after state persistence
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          result = json.loads(Path("output/portfolio-service-result.json").read_text())
          if not result["operational"]["data_checks_ok"]:
              raise SystemExit("Required market data checks failed; preserved state, no success heartbeat")
          PYCODE

  publish-health:
    needs: service
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      statuses: write
    steps:
      - name: Publish portfolio live health status
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ needs.service.result }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          job_status = os.environ["JOB_STATUS"]
          state = "success" if job_status == "success" else "failure"
          description = (
              "BTC clock-hybrid and ISA state validation passed"
              if state == "success"
              else "BTC/ISA portfolio workflow failed; inspect the linked run"
          )
          repository = os.environ["REPOSITORY"]
          sha = os.environ["COMMIT_SHA"]
          run_id = os.environ["RUN_ID"]
          payload = json.dumps(
              {
                  "state": state,
                  "context": "quant-guardian/portfolio-live",
                  "description": description,
                  "target_url": f"https://github.com/{repository}/actions/runs/{run_id}",
              }
          ).encode("utf-8")
          request = Request(
              f"https://api.github.com/repos/{repository}/statuses/{sha}",
              data=payload,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
                  "User-Agent": "quant-guardian-workflow-health",
              },
              method="POST",
          )
          with urlopen(request, timeout=30) as response:
              result = json.load(response)
          print(
              json.dumps(
                  {
                      "context": result["context"],
                      "state": result["state"],
                      "target_url": result["target_url"],
                  },
                  indent=2,
              )
          )
          PY
