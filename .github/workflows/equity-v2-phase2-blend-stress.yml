name: Equity v2 Phase-Two Blend Stress

on:
  push:
    branches:
      - "research/equity-v2-phase2"
    paths:
      - "equity_v2_phase2_blend_stress.py"
      - ".github/workflows/equity-v2-phase2-blend-stress.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: equity-v2-phase2-blend-stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile
        run: >
          python -m py_compile
          equity_v2_engine.py equity_v2_phase2_research.py
          equity_v2_phase2_blend_stress.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run refreshed stress study
        run: >
          python equity_v2_phase2_blend_stress.py
          --refresh
          --cost-bps 5
          --slippage-bps 5

      - name: Validate and upload
        run: |
          test -s output/equity_v2_phase2_synthetic_blend_stress.csv
          test -s output/equity_v2_phase2_synthetic_blend_stress.json
          python - <<'PY'
          import pandas as pd
          frame = pd.read_csv("output/equity_v2_phase2_synthetic_blend_stress.csv")
          assert len(frame) == 12
          assert {"blend_50_50_threshold10", "blend_40_60_threshold10"}.issubset(set(frame["strategy"]))
          assert frame["gfc_mdd"].lt(0).all()
          print(frame.to_string(index=False))
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: equity-v2-phase2-blend-stress-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            output/equity_v2_phase2_synthetic_blend_stress.csv
            output/equity_v2_phase2_synthetic_blend_stress.json
