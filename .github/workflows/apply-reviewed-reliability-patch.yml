name: Apply Reviewed Reliability Patch

on:
  push:
    branches: [fix/portfolio-reliability-20260905]
    paths:
      - '.reviewed-reliability/**'
      - '.github/workflows/apply-reviewed-reliability-patch.yml'

permissions:
  contents: write

concurrency:
  group: reviewed-reliability-import
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/portfolio-reliability-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact reviewed patch and apply only on the work branch
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor a6bb612ef6325c148d35eaa019622d1aec64655f HEAD
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          root=Path('.reviewed-reliability')
          parts=[(root/f'part{i}.txt').read_text().strip() for i in range(3)]
          # Correct a verified one-character transport duplication before digest validation.
          parts[2]=parts[2].replace('H96KKc8bLaxQR4l','H96Kc8bLaxQR4l')
          patch=gzip.decompress(base64.b64decode(''.join(parts),validate=True))
          digest=hashlib.sha256(patch).hexdigest()
          assert digest=='48dab8adf293808141fddff6cecf08c8efcd602277676012229d2ab5cc71e494',digest
          Path('/tmp/reviewed-reliability.patch').write_bytes(patch)
          print('Reviewed patch SHA-256 verified:',digest)
          PY
          git apply --check /tmp/reviewed-reliability.patch
          git apply --index /tmp/reviewed-reliability.patch
          git diff --cached --check
      - name: Verify standard-library-only service and complete test suites
        run: |
          python -S -c 'import btc_clock_hybrid_portfolio_runner; import portfolio_state_guard'
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
          node --test infra/watchdog/worker.test.mjs
      - name: Commit verified sources and remove this temporary importer
        id: commit
        run: |
          git rm .reviewed-reliability/part0.txt .reviewed-reliability/part1.txt .reviewed-reliability/part2.txt .github/workflows/apply-reviewed-reliability-patch.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: harden BTC and ISA recovery without changing investment rules'
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git archive --format=zip --output=/tmp/portfolio-reviewed-source.zip HEAD
          git push origin HEAD:refs/heads/fix/portfolio-reliability-20260905
      - name: Upload tested source (no live credentials or account state)
        if: always() && steps.commit.outputs.commit != ''
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-reviewed-source-${{ steps.commit.outputs.commit }}
          path: /tmp/portfolio-reviewed-source.zip
          retention-days: 7
          if-no-files-found: error
