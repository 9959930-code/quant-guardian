name: Equity v2 Blend Research

on:
  push:
    branches:
      - "research/equity-v2-leverage"
    paths:
      - "equity_v2_blend_research.py"
      - "tests/test_equity_v2_blend_research.py"
      - ".github/workflows/equity-v2-blend-research.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: equity-v2-blend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile modules
        run: >
          python -m py_compile
          quant_guardian.py equity_v2_engine.py equity_v2_research.py
          equity_v2_blend_research.py

      - name: Run all tests
        run: python -m unittest discover -s tests -v

      - name: Run refreshed blend research
        run: >
          python equity_v2_blend_research.py
          --refresh
          --cost-bps 5
          --slippage-bps 5

      - name: Validate outputs
        run: |
          test -s output/equity_v2_blend_results.csv
          test -s output/equity_v2_blend_curves.csv
          test -s output/equity_v2_blend_report.md
          test -s output/equity_v2_blend_manifest.json
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path

          manifest = json.loads(
              Path("output/equity_v2_blend_manifest.json").read_text(encoding="utf-8")
          )
          assert manifest["mode"] == "research-only"
          assert manifest["btc_changed"] is False
          assert manifest["live_equity_changed"] is False
          results = pd.read_csv("output/equity_v2_blend_results.csv")
          assert len(results) == 8
          fifty = results.loc[
              (results["rebalance"] == "none")
              & (results["aggressive_weight"].round(2) == 0.50)
          ]
          assert len(fifty) == 1
          assert float(fifty.iloc[0]["cagr"]) > 0
          assert float(fifty.iloc[0]["mdd"]) < 0
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY
          cat output/equity_v2_blend_report.md

      - name: Upload blend research artifact
        uses: actions/upload-artifact@v4
        with:
          name: equity-v2-blend-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            output/equity_v2_blend_*.csv
            output/equity_v2_blend_*.json
            output/equity_v2_blend_*.md
