name: Equity v2 Rebalance Policy Research

on:
  push:
    branches:
      - "research/equity-v2-modern-2006"
    paths:
      - "equity_v2_rebalance_policy_research.py"
      - "tests/test_equity_v2_rebalance_policy_research.py"
      - ".github/workflows/equity-v2-rebalance-policy-research.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: equity-v2-rebalance-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile research modules
        run: >
          python -m py_compile
          quant_guardian.py equity_v2_engine.py equity_v2_dca_engine.py
          equity_v2_modern_engine.py equity_v2_modern_research.py
          equity_v2_rebalance_policy_research.py
          tests/test_equity_v2_rebalance_policy_research.py

      - name: Run focused policy tests
        run: python -m unittest tests.test_equity_v2_rebalance_policy_research -v

      - name: Run all existing tests
        run: python -m unittest discover -s tests -v

      - name: Run frozen-end policy research
        run: python equity_v2_rebalance_policy_research.py --refresh

      - name: Validate outputs
        run: |
          test -s output/equity_v2_rebalance_policy_manifest.json
          test -s output/equity_v2_rebalance_policy_report.md
          test -s output/equity_v2_rebalance_policy_phase_a.csv
          test -s output/equity_v2_rebalance_policy_phase_b.csv
          test -s output/equity_v2_rebalance_policy_selected.csv
          test -s output/equity_v2_rebalance_policy_stress.csv
          test -s output/equity_v2_rebalance_policy_yearly_tax.csv
          test -s output/equity_v2_rebalance_policy_selected_trades.csv
          test -s output/equity_v2_rebalance_policy_selected_weights.csv
          test -s output/equity_v2_rebalance_policy_calibration.csv
          test -s output/equity_v2_policy_input_snapshot/manifest.json
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path

          manifest = json.loads(
              Path("output/equity_v2_rebalance_policy_manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          assert manifest["mode"] == "research-only"
          assert manifest["btc_changed"] is False
          assert manifest["live_equity_changed"] is False
          assert manifest["auto_order"] is False
          assert manifest["fixed_end"] == "2026-08-12"
          assert manifest["phase_a_count"] == 18
          assert manifest["phase_b_count"] == 15
          assert manifest["selected_count"] == 3
          assert len(manifest["input_snapshot"]["files"]) == 6

          phase_a = pd.read_csv("output/equity_v2_rebalance_policy_phase_a.csv")
          phase_b = pd.read_csv("output/equity_v2_rebalance_policy_phase_b.csv")
          selected = pd.read_csv("output/equity_v2_rebalance_policy_selected.csv")
          assert len(phase_a) == 18
          assert len(phase_b) == 15
          assert len(selected) == 3
          assert selected["portfolio_id"].nunique() == 3
          assert phase_a["full_after_tax_xirr"].notna().all()
          assert phase_b["full_after_tax_xirr"].notna().all()
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY
          cat output/equity_v2_rebalance_policy_report.md

      - name: Upload reproducible artifact
        uses: actions/upload-artifact@v4
        with:
          name: equity-v2-rebalance-policy-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
          path: |
            output/equity_v2_rebalance_policy_*.csv
            output/equity_v2_rebalance_policy_*.json
            output/equity_v2_rebalance_policy_*.md
            output/equity_v2_policy_input_snapshot/**
