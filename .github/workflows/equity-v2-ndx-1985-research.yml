name: Equity v2 NDX 1985 Research

on:
  push:
    branches:
      - "research/equity-v2-ndx-1985"
    paths:
      - "equity_v2_ndx_1985_research.py"
      - "tests/test_equity_v2_ndx_1985_research.py"
      - ".github/workflows/equity-v2-ndx-1985-research.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: equity-v2-ndx-1985-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile modules
        run: >
          python -m py_compile
          quant_guardian.py equity_v2_dca_engine.py
          equity_v2_qqq_synthetic_long.py equity_v2_ndx_1985_research.py

      - name: Run all tests
        run: python -m unittest discover -s tests -v

      - name: Run refreshed 1985 study
        run: python equity_v2_ndx_1985_research.py --refresh

      - name: Validate outputs
        run: |
          test -s output/equity_v2_ndx_1985_results.csv
          test -s output/equity_v2_ndx_1985_calibration.csv
          test -s output/equity_v2_ndx_1985_validation.csv
          test -s output/equity_v2_ndx_1985_sensitivity.csv
          test -s output/equity_v2_ndx_1985_manifest.json
          test -s output/equity_v2_ndx_1985_report.md
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path

          manifest = json.loads(
              Path("output/equity_v2_ndx_1985_manifest.json").read_text(encoding="utf-8")
          )
          assert manifest["mode"] == "research-only"
          assert manifest["btc_changed"] is False
          assert manifest["live_equity_changed"] is False
          assert manifest["ndx_data_start"] <= "1986-01-01"
          results = pd.read_csv("output/equity_v2_ndx_1985_results.csv")
          launch = results.loc[results["start_scenario"] == "ndx_launch"]
          assert "initial_3x_monthly_3x" in set(launch["strategy"])
          assert "fixed_mix_0pct_3x" in set(launch["strategy"])
          assert "fixed_mix_100pct_3x" in set(launch["strategy"])
          always = launch.loc[launch["strategy"] == "initial_3x_monthly_3x"].iloc[0]
          assert float(always["mdd"]) < -0.90
          validation = pd.read_csv("output/equity_v2_ndx_1985_validation.csv")
          assert {"dynamic_synthetic", "actual_tqqq"} == set(validation["model"])
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY
          cat output/equity_v2_ndx_1985_report.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: equity-v2-ndx-1985-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            output/equity_v2_ndx_1985_*.csv
            output/equity_v2_ndx_1985_*.json
            output/equity_v2_ndx_1985_*.md
