name: BTC v0.7 Alert Bootstrap

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/btc-v07-bootstrap.yml"

permissions:
  contents: read

concurrency:
  group: btc-v07-alert-bootstrap
  cancel-in-progress: false

jobs:
  start-alerts:
    if: contains(github.event.head_commit.message, '[start-btc-alerts]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile BTC advisory modules
        run: >
          python -m py_compile
          quant_guardian.py btc_guardian.py
          btc_v07_advisory.py btc_v07_split_advisory.py btc_v07_telegram.py

      - name: Run complete unit and regression tests
        run: python -m unittest discover -s tests -v

      - name: Prepare persistent BTC model state
        uses: actions/cache@v4
        with:
          path: data/state/btc_v07_state.json
          key: btc-v07-state-${{ github.run_id }}
          restore-keys: |
            btc-v07-state-

      - name: Build initial BTC v0.7 three-split advisory
        run: |
          mkdir -p data/state output
          python btc_v07_split_advisory.py \
            --refresh \
            --budget-krw 5000000 \
            --state-file data/state/btc_v07_state.json \
            --output output/btc_v07_advisory.json \
            --reset-model \
            --force-notify

      - name: Validate initial advisory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("output/btc_v07_advisory.json").read_text(encoding="utf-8")
          )
          assert payload["strategy_version"] == "btc-v07-vol40-upbit-three-split-advisory-1.1"
          assert payload["schema_version"] == 2
          assert payload["auto_order"] is False
          assert payload["should_notify"] is True
          assert payload["execution_policy"]["entry_parts"] == 3
          assert payload["execution_policy"]["exit_parts"] == 3
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY

      - name: Send initial Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python btc_v07_telegram.py --data-file output/btc_v07_advisory.json
