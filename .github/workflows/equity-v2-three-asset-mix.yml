name: Equity v2 Three-Asset Mix Research

on:
  push:
    branches:
      - "research/equity-v2-modern-2006"
    paths:
      - "equity_v2_three_asset_mix_research.py"
      - ".github/workflows/equity-v2-three-asset-mix.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: equity-v2-three-asset-mix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile focused study
        run: python -m py_compile equity_v2_three_asset_mix_research.py

      - name: Run focused study
        run: python equity_v2_three_asset_mix_research.py --refresh

      - name: Validate outputs
        run: |
          test -s output/equity_v2_three_asset_mix_annual.csv
          test -s output/equity_v2_three_asset_mix_pareto.csv
          test -s output/equity_v2_three_asset_mix_report.md
          test -s output/equity_v2_three_asset_mix_manifest.json
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path

          manifest = json.loads(
              Path("output/equity_v2_three_asset_mix_manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          assert manifest["mode"] == "research-only"
          assert manifest["btc_changed"] is False
          assert manifest["live_equity_changed"] is False
          assert manifest["auto_order"] is False
          assert manifest["combination_count"] == 231
          assert manifest["all_three_positive_count"] == 171
          results = pd.read_csv("output/equity_v2_three_asset_mix_annual.csv")
          assert len(results) == 231
          assert abs((results[["tqqq_weight", "qld_weight", "qqq_weight"]].sum(axis=1) - 1).abs().max()) < 1e-12
          assert {
              "qld_100",
              "tqqq50_qqq50",
              "best_all_three_score",
              "best_all_three_at_2x",
          }.issubset(manifest["picks"])
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload reproducible artifact
        uses: actions/upload-artifact@v4
        with:
          name: equity-v2-three-asset-mix-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          path: |
            output/equity_v2_three_asset_mix_*.csv
            output/equity_v2_three_asset_mix_*.json
            output/equity_v2_three_asset_mix_*.md
