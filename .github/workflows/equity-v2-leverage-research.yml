name: Equity v2 Leveraged Research

on:
  push:
    branches:
      - "research/equity-v2-leverage"
    paths:
      - "equity_v2_engine.py"
      - "equity_v2_research.py"
      - "tests/test_equity_v2_research.py"
      - "docs/equity/v2/**"
      - ".github/workflows/equity-v2-leverage-research.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "equity_v2_engine.py"
      - "equity_v2_research.py"
      - "quant_guardian.py"
      - "config.toml"
      - "tests/test_equity_v2_research.py"
      - "docs/equity/v2/**"
      - ".github/workflows/equity-v2-leverage-research.yml"

permissions:
  contents: read

concurrency:
  group: equity-v2-leverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile research modules
        run: >
          python -m py_compile
          quant_guardian.py equity_v2_engine.py equity_v2_research.py

      - name: Run all unit and regression tests
        run: python -m unittest discover -s tests -v

      - name: Run refreshed Equity v2 research
        run: >
          python equity_v2_research.py
          --refresh
          --cost-bps 5
          --slippage-bps 5

      - name: Validate research outputs
        run: |
          test -s output/equity_v2_manifest.json
          test -s output/equity_v2_report.md
          test -s output/equity_v2_broad.csv
          test -s output/equity_v2_exact.csv
          test -s output/equity_v2_refinement.csv
          test -s output/equity_v2_final_winners.csv
          test -s output/equity_v2_robustness.csv
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path

          manifest = json.loads(
              Path("output/equity_v2_manifest.json").read_text(encoding="utf-8")
          )
          assert manifest["mode"] == "research-only"
          assert manifest["btc_changed"] is False
          assert manifest["live_equity_changed"] is False
          assert manifest["auto_order"] is False
          assert manifest["broad_candidate_count"] > 9000
          assert manifest["shortlist_count"] > 50
          winners = pd.read_csv("output/equity_v2_final_winners.csv")
          assert not winners.empty
          assert "absolute_return" in set(winners["category"])
          assert winners["candidate_id"].notna().all()
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY
          cat output/equity_v2_report.md

      - name: Upload reproducible research artifact
        uses: actions/upload-artifact@v4
        with:
          name: equity-v2-leverage-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          path: |
            output/equity_v2_*.csv
            output/equity_v2_*.json
            output/equity_v2_*.md
