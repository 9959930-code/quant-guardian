name: Equity v2 Annual Band Research

on:
  push:
    branches:
      - "research/equity-v2-modern-2006"
    paths:
      - "equity_v2_annual_band_research.py"
      - "tests/test_equity_v2_annual_band_research.py"
      - ".github/workflows/equity-v2-annual-band-research.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: equity-v2-annual-band-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download frozen input artifact
        uses: actions/download-artifact@v4
        with:
          name: equity-v2-rebalance-policy-1ba482d7d81f6cc27247c52d8025f41133681295
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: 9959930-code/quant-guardian
          run-id: 31824527577
          path: seed-artifact

      - name: Seed exact cached inputs
        run: |
          mkdir -p data/cache
          cp seed-artifact/equity_v2_policy_input_snapshot/QQQ.csv data/cache/yahoo_QQQ.csv
          cp seed-artifact/equity_v2_policy_input_snapshot/QLD.csv data/cache/yahoo_QLD.csv
          cp seed-artifact/equity_v2_policy_input_snapshot/TQQQ.csv data/cache/yahoo_TQQQ.csv
          cp seed-artifact/equity_v2_policy_input_snapshot/_IRX.csv data/cache/yahoo__IRX.csv
          cp 'seed-artifact/equity_v2_policy_input_snapshot/KRW=X.csv' 'data/cache/yahoo_KRW=X.csv'
          cp seed-artifact/equity_v2_policy_input_snapshot/_NDX.csv data/cache/yahoo__NDX.csv
          sha256sum data/cache/*.csv

      - name: Compile research modules
        run: >
          python -m py_compile
          quant_guardian.py equity_v2_engine.py equity_v2_dca_engine.py
          equity_v2_modern_engine.py equity_v2_modern_research.py
          equity_v2_rebalance_policy_research.py equity_v2_annual_band_research.py
          tests/test_equity_v2_annual_band_research.py

      - name: Run focused annual-band tests
        run: python -m unittest tests.test_equity_v2_annual_band_research -v

      - name: Run all tests
        run: python -m unittest discover -s tests -v

      - name: Run annual-band research
        run: python equity_v2_annual_band_research.py

      - name: Validate outputs and input identity
        run: |
          test -s output/equity_v2_annual_band_manifest.json
          test -s output/equity_v2_annual_band_report.md
          test -s output/equity_v2_annual_band_results.csv
          test -s output/equity_v2_annual_band_selected.csv
          test -s output/equity_v2_annual_band_stress.csv
          test -s output/equity_v2_annual_band_yearly_tax.csv
          test -s output/equity_v2_annual_band_selected_trades.csv
          test -s output/equity_v2_annual_band_selected_weights.csv
          test -s output/equity_v2_annual_band_calibration.csv
          test -s output/equity_v2_policy_input_snapshot/manifest.json
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path

          manifest = json.loads(
              Path("output/equity_v2_annual_band_manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          assert manifest["mode"] == "research-only"
          assert manifest["btc_changed"] is False
          assert manifest["live_equity_changed"] is False
          assert manifest["auto_order"] is False
          assert manifest["fixed_end"] == "2026-08-12"
          assert manifest["policy_count"] == 27
          assert manifest["selected_count"] == 3
          hashes = {
              item["ticker"]: item["sha256"]
              for item in manifest["input_snapshot"]["files"]
          }
          assert hashes["QQQ"] == "06f837b2e33cff1df39dcebd357743a9f3f4fef7f0cdb0fc79248499c8b8063f"
          assert hashes["QLD"] == "638e1a26f57e2a730644fc4ed38bb9b238936d4939a185efe8502e226eb0d35d"
          assert hashes["TQQQ"] == "34182fd87092264d2c8c0a3ff52816c554b4573188022a3e88a417b1de333077"
          assert hashes["^IRX"] == "9f9d8d9c8d880ee555e4ceb4cfe092ad71e88c75a42d3e85ef3f644f173fc58f"
          assert hashes["KRW=X"] == "370dc4f1da2aa51db32ad64fcb99a1879e35fd4d729597035f0188d00b451907"
          assert hashes["^NDX"] == "728508a4529512f8d72b6d68557c7f80bc382eb469eabf2223aea79d7df685d2"

          results = pd.read_csv("output/equity_v2_annual_band_results.csv")
          selected = pd.read_csv("output/equity_v2_annual_band_selected.csv")
          assert len(results) == 27
          assert len(selected) == 3
          assert results["full_after_tax_xirr"].notna().all()
          assert selected["portfolio_id"].nunique() == 3
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY
          cat output/equity_v2_annual_band_report.md

      - name: Upload reproducible artifact
        uses: actions/upload-artifact@v4
        with:
          name: equity-v2-annual-band-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
          path: |
            output/equity_v2_annual_band_*.csv
            output/equity_v2_annual_band_*.json
            output/equity_v2_annual_band_*.md
            output/equity_v2_policy_input_snapshot/**
