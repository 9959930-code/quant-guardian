[settings]
data_source = "yahoo"
cache_dir = "data/cache"
output_dir = "output"
base_currency = "USD"

[market_timing]
market_asset = "SPY"
growth_asset = "QQQ"
vix_symbol = "^VIX"
calm_vix = 20
high_vix = 30

[qg_core]
name = "QG Index Timing"
equity_etfs = ["SPY", "QQQ", "SPYG", "XLK", "SMH"]
broad_etfs = ["SPY", "QQQ", "SPYG"]
satellite_etfs = ["XLK", "SMH"]
live_safety_asset = "SGOV"
backtest_safety_asset = "SHY"
gold_asset = "GLD"
bond_asset = "TLT"
backtest_start_date = "2016-01-01"
transaction_cost_bps = 10
minimum_equity_score = 52
minimum_satellite_score = 62
max_equity_positions = 2
top_position_share = 0.60
max_satellite_weight = 0.50

[qg_core_execution_map]
SPY = "SPYM"
QQQ = "QQQM"

[qg_core_allocations.buy]
equity = 1.00
safety = 0.00
gold = 0.00
bond = 0.00

[qg_core_allocations.accumulate]
equity = 0.90
safety = 0.05
gold = 0.025
bond = 0.025

[qg_core_allocations.hold]
equity = 0.75
safety = 0.15
gold = 0.05
bond = 0.05

[qg_core_allocations.trim]
equity = 0.50
safety = 0.40
gold = 0.05
bond = 0.05

[qg_core_allocations.exit]
equity = 0.00
safety = 0.80
gold = 0.10
bond = 0.10

[btc]
enabled = true
run_mode = "shadow"
auto_order = false
execution_market = "KRW-BTC"

[btc.data]
upbit_start_date = "2017-09-25"
usd_symbol = "BTC-USD"
fx_symbol = "KRW=X"
max_block_height_gap = 3
block_staleness_hours = 1.0
coinmetrics_required_metrics = [
  "CapMVRVCur",
  "HashRate",
  "FeeTotNtv",
  "IssTotNtv",
  "IssTotUSD",
  "PriceUSD",
  "CapMrktCurUSD",
  "SplyCur",
]
